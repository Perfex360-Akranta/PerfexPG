vocITHead=Dear IT User,
vocITContent=IT being an important service activity taking care of the business requirements, we would like to know from you about where we're performing well and where we need to.
vocGuidance=Guide: Each question is rated on two parameters (Importance and Effectiveness)Importance checks how important a particular service is to your department, while Effectiveness checks the efficiency of IS department in executing the service.
pointImportance=1. Importance: How important according to you is the respective area, a particular question is addressing on a scale of 1 to 10, 1 being least important and 10 being the most important.
pointEffective=2. Effectiveness: How do you rate the delivery of service to you in the respective area that the question is addressing on a scale of 1 to 10, 1 being least effective and 10 being the most effective, with 6 being the generally accepted Satisfactory level.Where ever the score is less than "6", please mention the reasons under "Areas to be Improved".
pointNA=3. Select NA(Not Applicable) if a question is checking something which is not being serviced to your department by the respective function and Importance & Effectiveness is not valid for "NA".